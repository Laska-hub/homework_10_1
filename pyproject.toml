[project]
name = "homework-9-1"
version = "0.1.0"
description = ""
authors = [
    {name = "Olesia Laskovets",email = "olesya_izvarina@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
]

[tool.poetry]
packages = [{include = "homework_9.1"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "requests (>=2.32.5,<3.0.0)",
    "pytest (>=9.0.1,<10.0.0)"
]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=1.19.0,<2.0.0)",
    "black (>=25.11.0,<26.0.0)",
    "isort (>=7.0.0,<8.0.0)"
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
strict_optional = true
ignore_missing_imports = true
exclude = '''
(
    (^|/)venv/
  | (^|/)\.venv/
  | (^|/)(\.eggs|\.git|\.hg|\.mypy_cache|\.tox|dist|build)/
  | __pycache__
)
'''

[tool.isort]
# Максимальная длина строки
line_length = 119
[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы, которые не нужно форматировать
exclude = '''
(
    (^|/)venv/
  | (^|/)(\.eggs|\.git|\.hg|\.mypy_cache|\.tox|dist)/
  | foo\.py$
)
'''



